services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: adrobot
      POSTGRES_USER: adrobot
      POSTGRES_PASSWORD: adrobot
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U adrobot -d adrobot"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - database

  backend:
    build: ./backend
    env_file: ./backend/.env
    environment:
      DATABASE_URL: postgresql+psycopg://adrobot:adrobot@postgres:5432/adrobot
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - database
      - application

  frontend:
    build: ./frontend
    ports:
      - "127.0.0.1:8080:80"
    depends_on:
      - backend
    networks:
      - application

networks:
  database:
    internal: true
  application:

volumes:
  postgres_data:
